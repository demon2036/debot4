[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debot4"
version = "0.1.0"
description = "Low-resource, evidence-first BSC meme narrative and paper-trading system"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "requests[socks]>=2.32,<3"]

[project.optional-dependencies]
telegram = [
    "Telethon>=1.43,<2",
    "python-socks[asyncio]>=2.4,<3",
]

[project.scripts]
debot4 = "debot4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
